<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback · Tangled Taste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="../src/feedback.css" />
  </head>
  <body>
    <main class="card">
      <a class="back" href="../">← Back to the map</a>
      <h1>Tangled Taste</h1>
      <h2>Share your feedback</h2>
      <p class="lede">Found a bug, have an idea, or just want to say something? I read everything. Name and email are optional; if you leave an email, I may reply.</p>
      <form id="form" novalidate>
        <label>Type
          <select id="category" name="category">
            <option value="idea">Idea</option>
            <option value="bug">Bug</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>Name <span class="opt">(optional)</span>
          <input id="name" name="name" type="text" maxlength="100" autocomplete="name" />
        </label>
        <label>Email <span class="opt">(optional)</span>
          <input id="email" name="email" type="email" maxlength="200" autocomplete="email" />
        </label>
        <label>Feedback
          <textarea id="message" name="message" rows="9" maxlength="5000" required></textarea>
        </label>
        <div class="trap" aria-hidden="true"><label>Website <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" /></label></div>
        <div class="row">
          <button id="send" type="submit">Send feedback</button>
          <span id="count" class="count">0 / 5000</span>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="fine">Your message is stored privately. Nothing about your network address is saved.</p>
    </main>
    <script type="module" src="../src/feedback.js"></script>
  </body>
</html>
