<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tangled Taste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Caveat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="washes" aria-hidden="true"></div>
    <div id="stage"></div>
    <div id="labels" aria-hidden="true"></div>

    <header id="topbar">
      <div id="brand" role="button" tabindex="0" title="Back to the whole atlas">
        <span class="brand-title">Tangled Taste</span>
        <span class="brand-sub">ingredients that share a plate</span>
      </div>
      <div id="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg>
        <input id="search-input" type="search" placeholder="Search ingredients, dishes, cuisines, places…" autocomplete="off" spellcheck="false" />
        <kbd>/</kbd>
        <ul id="search-results" role="listbox"></ul>
      </div>
      <div id="topright">
        <button id="size-toggle" type="button" role="switch" aria-checked="true" title="On: common ingredients are drawn larger. Off: every ingredient is the same size.">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="3.5" /><circle cx="16.5" cy="8.5" r="5.5" /></svg>
          <span>Size by popularity</span>
          <i class="switch" aria-hidden="true"></i>
        </button>
        <button id="illus-toggle" type="button" role="switch" aria-checked="true" title="Show or hide the food illustrations on the map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14" /><path d="M5 19c3-5 6-8 10-10" /></svg>
          <span>Illustrations</span>
          <i class="switch" aria-hidden="true"></i>
        </button>
      <button id="reset" type="button" title="Return to the full atlas (Home)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" /><path d="M4 4.5v4h4" /></svg>
          Reset view
        </button>
      </div>
    </header>

    <div id="filters" role="group" aria-label="Filter by dish type"></div>

    <aside id="panel"><div id="panel-inner"></div></aside>

    <nav id="atlas">
      <button id="atlas-toggle" aria-expanded="true">Cuisines of the world</button>
      <div id="atlas-body"></div>
    </nav>

    <nav id="compare" aria-label="Compare cuisines">
      <button id="compare-toggle" aria-expanded="false">Compare cuisines</button>
      <div id="compare-body">
        <p class="hint">Pick up to three cuisines. Their ingredients light up in three colors, and pairings they share are drawn as striped lines.</p>
        <div id="compare-slots"></div>
        <input id="compare-search" type="search" placeholder="Find a cuisine…" autocomplete="off" spellcheck="false" />
        <div id="compare-list"></div>
        <p id="compare-msg" role="status"></p>
      </div>
    </nav>

    <div id="tooltip"></div>
    <div id="hint">drag to turn the globe · scroll to zoom · click an ingredient to explore · <span>esc</span> to step back</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
